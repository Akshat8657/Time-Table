<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TimeTablePro - college timetable management" />
    <meta name="theme-color" content="#4f46e5" />
    <title>TimeTablePro</title>
    <script>
      // Runs before the page paints, so the right theme shows immediately (no flash).
      // The saved theme is used ONLY if the visitor accepted cookies; otherwise follow the device setting.
      (function () {
        try {
          var c = document.cookie;
          var get = function (n) {
            var m = c.match(new RegExp('(?:^|; )' + n + '=([^;]*)'));
            return m ? decodeURIComponent(m[1]) : null;
          };
          var theme = get('tt_consent') === 'accepted' ? get('tt_theme') : null;
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
